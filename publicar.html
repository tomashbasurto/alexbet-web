// ---------- datos ----------
const ECU = -5 * 3600e3;
const dayOf = ts => new Date(ts + ECU).toISOString().slice(0, 10);
const hora = ts => new Date(ts + ECU).toISOString().slice(11, 16);
const hoy = () => dayOf(Date.now());
const sumDay = (d, k) => new Date(Date.parse(d + 'T12:00:00Z') + k * 864e5).toISOString().slice(0, 10);
const DIAS = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'], MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const fechaTxt = d => { const x = new Date(d + 'T12:00:00Z'); return `${DIAS[x.getUTCDay()]} ${x.getUTCDate()} ${MESES[x.getUTCMonth()]}`; };

const SPN = {futbol:'Fútbol', nba:'NBA', ncaa:'NCAA', nhl:'NHL', eul:'Euroliga', tenis:'Tenis', mlb:'MLB'};
const LGN = {nba:'NBA', ncaa:'NCAA', nhl:'NHL', eul:'Euroliga', mlb:'MLB'};
// grupos de mercado para las imágenes
const GROUPS = [
  {k:'top',  t:'Top del día',         ic:'⭐', f:p => true},
  {k:'gol',  t:'Goles',               ic:'⚽', f:p => p.sp==='futbol' && p.cat==='goles'},

  {k:'bas',  t:'Básquet',             ic:'🏀', f:p => ['nba','ncaa','eul'].includes(p.sp)},

];
// grupos de las rachas (oportunidades: equipos y jugadores que superaron la línea en sus últimos partidos)
const RGROUPS = [
  {k:'top',  t:'Top equipos',        ic:'⭐', f:p => p.kind==='team'},
  {k:'rgol', t:'Goles',              ic:'⚽', f:p => p.sp==='futbol' && p.kind==='team' && p.mk==='goles'},
  {k:'rcor', t:'Córners',            ic:'🚩', f:p => p.sp==='futbol' && p.kind==='team' && p.mk==='córners'},
  {k:'rtar', t:'Tarjetas',           ic:'🟨', f:p => p.sp==='futbol' && p.kind==='team' && p.mk==='tarjetas'},
  {k:'rrem', t:'Remates al arco',    ic:'🎯', f:p => p.sp==='futbol' && p.kind==='team' && p.mk==='remates al arco'},
  {k:'rjug', t:'Jugadores fútbol',   ic:'👟', f:p => p.sp==='futbol' && p.kind==='player'},
  {k:'rbe',  t:'Básquet equipos',    ic:'🏀', f:p => ['nba','ncaa','eul'].includes(p.sp) && p.kind==='team'},
  {k:'rbj',  t:'Básquet jugadores',  ic:'⛹️', f:p => ['nba','ncaa','eul'].includes(p.sp) && p.kind==='player'},
  {k:'rnhl', t:'NHL',                ic:'🏒', f:p => p.sp==='nhl'},
  {k:'rten', t:'Tenis',              ic:'🎾', f:p => p.sp==='tenis'},
  {k:'rmlb', t:'MLB',                ic:'⚾', f:p => p.sp==='mlb'},
];
let SPF = 'all', LGF = 'all';
let QB = '', QBT = 0, LIM = 40;
let PICKS = [], OPS = [], ESC = {}, MODE = 'pro', DAY = hoy(), GRP = 'top', SEL = {}, OUT = [];

// primero GitHub Pages; si el archivo aún no llegó ahí (las publicaciones de Pages a veces se atrasan), directo del repositorio
const RAW = 'https://raw.githubusercontent.com/tomashbasurto/alexbet-web/main/';
async function getJ(f){
  const q = '?t=' + Math.floor(Date.now()/60000);
  try{ const r = await fetch(MIRROR + f + q, {cache:'no-cache'}); if(r.ok) return await r.json(); }catch(e){}
  const r = await fetch(RAW + f + q, {cache:'no-cache'}); if(!r.ok) throw new Error(f + ' ' + r.status); return r.json();
}
async function cargar(){
  $('app').innerHTML = '<div class="msg">Cargando sugerencias…</div>';
  try{
    const [h, e, o, st, dt, rus, rtn] = await Promise.all([getJ('historial.json'), getJ('escudos/escudos.json').catch(()=>({})), getJ('oportunidades.json').catch(()=>({items:[]})), getJ('stats-futbol.json').catch(()=>({ev:{}})), getJ('datos.json').catch(()=>({fx:{}})), getJ('recientes-us.json').catch(()=>({})), getJ('recientes-tenis.json').catch(()=>({j:{}}))]);
    PICKS = (h.picks || []).slice(); ESC = e || {};
    OPS = (o.items || []).map((x, i) => {
      const who = x.kind==='player' ? x.pname : (x.who==='Partido' ? '' : x.who);
      const label = `${who ? who + ' · ' : ''}Más de ${x.ln} ${x.mk.toLowerCase()}${x.kind!=='player' && x.who==='Partido' ? ' en el partido' : ''}`;
      return {id:'op'+i, sp:x.sp, lid:x.lid, kind:x.kind, mk:x.mk, pname:x.pname, team:x.team, pid:x.pid, who:x.who, avg:x.avg, role:x.role, h:x.h, a:x.a, ts: x.when ? Date.parse(String(x.when).slice(0,16)+':00Z') : x.ts, where:x.lname, color:x.color, label, prob:x.p, hit:x.hit, n:x.n, vals:x.vals, ln:x.ln};
    });
    // las sugerencias de la app que coinciden con una racha muestran también sus barras
    PICKS.forEach(p => { const m = p.mkt || {}; if(m.t!=='tot' || m.o!==1) return; const mk = {g:'goles', c:'córners', k:'tarjetas'}[m.k] || (p.sp!=='futbol' && m.k==='p' ? 'puntos' : null); if(!mk) return;
      const x = (o.items || []).find(x => x.h===p.h && x.a===p.a && x.kind==='team' && x.who==='Partido' && x.mk===mk && x.ln===m.L); if(x){ p.vals = x.vals; p.hit = x.hit; p.n = x.n; p.ln = x.ln; p.color = x.color; } });
    // el resto de las sugerencias de fútbol (goles, córners, tarjetas, más o menos): últimos 5 partidos de cada equipo
    const BY = {}; Object.values(st.ev || {}).forEach(r => { if(!Array.isArray(r) || !r[6] || !r[7]) return; [r[4], r[5]].forEach(n => (BY[n] = BY[n] || []).push(r)); });
    const byN = {}; Object.keys(BY).forEach(k => { const q = nrm(k); (byN[q] = byN[q] || []).push(...BY[k]); });
    // goles: de los partidos jugados en datos.json (mismos nombres que la app); córners y tarjetas: de stats-futbol.json
    const GB = {}; Object.values(dt.fx || {}).forEach(L => (L.fx || []).forEach(f => { if(f.s!=='FT' || !f.g || f.g[0]==null) return; const r = [Date.parse(f.d+':00Z'), 0, 0, 0, f.h, f.a, [f.g[0]], [f.g[1]]]; [f.h, f.a].forEach(n => (GB[n] = GB[n] || []).push(r)); }));
    const rowsOf = (n, k) => k==='g' ? (GB[n] || []) : (BY[n] || byN[nrm(n)] || []);
    const tot = (k, r) => k==='g' ? r[6][0]+r[7][0] : k==='k' ? r[6][1]+r[7][1] : (r[6][4]+r[6][5]+r[7][4]+r[7][5]);
    PICKS.forEach(p => { const m = p.mkt || {}; if(p.vals || p.sp!=='futbol' || m.t!=='tot' || !['g','k','c'].includes(m.k)) return;
      const last = n => rowsOf(n, m.k).filter(r => r[0] < p.ts - 3600e3).sort((a,b)=>b[0]-a[0]).slice(0,5).map(r => tot(m.k, r)).filter(v => v!=null && !isNaN(v));
      const vh = last(p.h), va = last(p.a); if(vh.length + va.length < 5) return;
      const v = []; for(let i = 0; i < 5; i++){ if(vh[i]!=null) v.push(vh[i]); if(va[i]!=null) v.push(va[i]); }
      p.vals = v; p.ln = m.L; p.under = m.o===0; p.n = v.length; p.hit = v.filter(a => p.under ? a < m.L : a > m.L).length; p.sub = '5 de cada equipo';
    });
    // básquet y hockey: últimos partidos de cada equipo (recientes-us.json); tenis: de cada jugador (recientes-tenis.json)
    const fnd = (M, n) => { if(!M) return null; if(M[n]) return M[n]; const q = nrm(n), k = Object.keys(M).find(x => nrm(x) === q); return k ? M[k] : null; };
    const mix = (a, b) => { const v = []; for(let i = 0; i < 5; i++){ if(a[i]!=null) v.push(a[i]); if(b[i]!=null) v.push(b[i]); } return v; };
    PICKS.forEach(p => { if(p.vals) return; const m = p.mkt || {};
      if(['nba','ncaa','nhl'].includes(p.sp)){
        const R = rus[p.sp], gh = (fnd(R, p.h) || []).filter(g => g[0] < p.ts - 3600e3), ga = (fnd(R, p.a) || []).filter(g => g[0] < p.ts - 3600e3);
        if(m.t==='tot'){ const v = mix(gh.map(g=>g[1]+g[2]), ga.map(g=>g[1]+g[2])); if(v.length < 5) return;
          Object.assign(p, {vals:v, ln:m.L, under:m.o===0, n:v.length, hit:v.filter(a => m.o===0 ? a < m.L : a > m.L).length, sub:'5 de cada equipo'}); }
        else if(m.t==='win' || m.t==='line'){ const G = (m.s==='a' ? ga : gh).slice(0, 10); if(G.length < 4) return;
          const sm = String(p.label).match(/([+-]\d+(?:\.\d+)?)\s*$/), sv = m.t==='line' ? (sm ? parseFloat(sm[1]) : m.L) : 0;
          const v = G.map(g => g[1]-g[2]), lv = -sv;
          Object.assign(p, {vals:v, ln:lv, diff:1, n:v.length, hit:v.filter(a => a > lv).length, sub:'últimos '+v.length, passTxt: m.t==='win' ? 'partidos ganados' : 'cubrió la línea'}); }
      } else if(p.sp==='tenis'){
        const J = rtn.j || {}, lb = String(p.label);
        let mm;
        if((mm = lb.match(/^(.+) gana al menos un set$/))){ const L = (fnd(J, mm[1]) || []).slice(0, 10); if(L.length < 4) return; const v = L.map(x=>x[2]);
          Object.assign(p, {vals:v, ln:0.5, n:v.length, hit:v.filter(a=>a>0.5).length, sub:'sets ganados', passTxt:'ganó un set o más'}); }
        else if((mm = lb.match(/^Gana (.+)$/))){ const L = (fnd(J, mm[1]) || []).slice(0, 10); if(L.length < 4) return; const v = L.map(x=>x[2]-x[3]);
          Object.assign(p, {vals:v, ln:0, diff:1, n:v.length, hit:L.filter(x=>x[1]).length, sub:'últimos '+v.length, passTxt:'partidos ganados'}); }
        else if((mm = lb.match(/^(Más|Menos) de ([\d.]+) juegos/))){ const N = parseFloat(mm[2]), un = mm[1]==='Menos';
          const v = mix((fnd(J, p.h)||[]).map(x=>x[4]), (fnd(J, p.a)||[]).map(x=>x[4])); if(v.length < 5) return;
          Object.assign(p, {vals:v, ln:N, under:un, n:v.length, hit:v.filter(a => un ? a < N : a > N).length, sub:'5 de cada jugador'}); }
      }
    });
    pintar();
  }catch(err){ $('app').innerHTML = `<div class="msg err">No se pudieron leer las sugerencias (${esc(err.message)}).</div>`; }
}
// Rachas: las de Oportunidades + las sugerencias de deportes que no salen ahí (tenis, MLB) cuando tienen su racha
// Pronósticos = sugerencias de la app + rachas de Oportunidades (sin repetir el mismo partido, mercado y línea)
let TYPE = 'team', ROLE = 'all'; // v48 · jugadores de básquet: titulares o suplentes (como en Oportunidades de la app)
const MKN = {g:'goles', k:'córners', c:'tarjetas', p:'puntos'};
function proPool(){
  const P = PICKS.map(p => Object.assign({}, p, {kind:'team'}));
  const seen = new Set(P.map(p => { const m = p.mkt || {}; return m.t==='tot' && m.o===1 ? `${p.h}|${p.a}|${MKN[m.k]||''}|${m.L}` : ''; }).filter(Boolean));
  return P.concat(OPS.filter(o => !(o.kind==='team' && /en el partido$/.test(o.label) && seen.has(`${o.h}|${o.a}|${o.mk}|${o.ln}`))));
}
const dayPicks = () => (MODE==='res' ? PICKS : proPool().filter(p => p.kind === TYPE && (TYPE !== 'player' || ROLE === 'all' || p.role === ROLE))).filter(p => dayOf(p.ts) === DAY);
// mercados: fijos para equipos; para jugadores, uno por cada mercado que haya ese día (puntos, rebotes, faltas…)
const TGROUPS = [

    <div class="flt" style="margin-top:8px"><label><span>Publicar ya</span><select id="fbM">${Object.entries({'pro:8':'Pronósticos (2 imágenes)', resdep:'Resultados de ayer', reel:'Reel con voz', 'reel:nba':'Reel de NBA', sem:'Resumen de la semana'}).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
      <label><span>&nbsp;</span><button class="btn" id="fbY" style="margin:0;min-height:42px" ${FBS.busy || st.ya ? 'disabled' : ''}>Publicar ya</button></label></div>${pend}
    ${hist ? `<div class="note" style="margin:10px 0 4px">Últimas publicaciones:</div>${hist}` : '<div class="note" style="margin:10px 0 0">Todavía no hay registro (empieza con la próxima publicación).</div>'}` : ''}
    ${FBS.err ? `<div class="msg err" style="margin-top:6px">${esc(FBS.err)}</div>` : ''}`;
  $('fbT').onclick = () => { FBS.open = !FBS.open; fbBox(); };
  if($('fbP')) $('fbP').onclick = () => fbSet({pausa: !st.pausa});
  if($('fbY')) $('fbY').onclick = () => { const m = $('fbM').value; if(confirm(`¿Publicar "${FB_N[m]}" en la página de Facebook ahora? Sale en unos 15 minutos.`)) fbSet({ya: m, yaT: Date.now()}); };
}

const VZ = {id: 'es_ES-sharvard-medium', tono: 1, vel: 1, voz: null, busy: false, out: null, cv: null};
const vmsg = (t, pct) => { const m = $('vMsg'); if(m) m.innerHTML = esc(t) + (pct != null ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''); };
async function precargar(){ // si la voz ya está guardada, se prepara en segundo plano
  if(VZ.voz || VZ.pre) return; if(!(await vozGuardada(VZ.id))) return;
  const id = VZ.id, v = new Voz(id); VZ.pre = v.init().then(() => { if(VZ.id === id && !VZ.voz) VZ.voz = v; }).catch(() => {}).finally(() => { VZ.pre = null; });
}
async function vozLista(){
  if(VZ.pre){ vmsg('Preparando la voz…'); await VZ.pre; }
  if(VZ.voz && VZ.voz.id === VZ.id) return VZ.voz;
  const guard = await vozGuardada(VZ.id);
  vmsg(guard ? 'Preparando la voz…' : 'Bajando la voz por primera vez (unos 60 MB)…', guard ? null : 0);
  const v = new Voz(VZ.id);
  await v.init((got, tot) => { if(!guard) vmsg(`Bajando la voz… ${Math.round(got/1e6)} de ${Math.round((tot||63e6)/1e6)} MB`, tot ? Math.round(got/tot*100) : null); });
  return VZ.voz = v;
}
// audio desbloqueado en el mismo toque (iPhone no deja iniciarlo después)
function audioToque(){
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  try{ const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); }catch(e){}
  ac.resume().catch(() => {}); return ac;
}
function pedirToque(ac){
  return new Promise(res => { const box = $('vMsg'); if(!box) return res();
    box.innerHTML = '<button class="btn" id="vTap">▶ Toca aquí para empezar a grabar</button>';
    $('vTap').onclick = () => { ac.resume().finally(() => { box.textContent = 'Grabando el video… (deja esta pantalla abierta)'; res(); }); }; });
}
async function probarVoz(){
  if(VZ.busy) return; VZ.busy = true; const ac = audioToque();
  try{
    const v = await vozLista(); vmsg('Generando…');
    const a = await v.decir(hablar('Hola. Esta es la voz de AlexBet. Oportunidad uno: más de 1.5 goles. Nuestro modelo le da 77%.'.replace('AlexBet', 'álex bet')), VZ.vel / VZ.tono);
    if(ac.state !== 'running') await ac.resume().catch(() => {});
    const b = ac.createBuffer(1, a.pcm.length, a.sr); b.copyToChannel(a.pcm, 0); const src = ac.createBufferSource(); src.buffer = b; src.playbackRate.value = VZ.tono; src.connect(ac.destination); src.start(); src.onended = () => ac.close();
    vmsg('Escuchando la voz…');
  }catch(e){ vmsg('No se pudo cargar la voz: ' + e.message); }
  VZ.busy = false;
}
function statsGen(){ const R = PICKS.filter(p => p.res === 0 || p.res === 1), ok = R.filter(p => p.res === 1).length; return {n: R.length, ok, pct: R.length ? Math.round(ok / R.length * 100) : 0}; }
async function imgsVideo(p){
  const foto = async () => { if(p.kind !== 'player' || !p.pid) return null; const f = ESC['j:' + String(p.pid).split('|')[0]]; if(!f || f === '-') return null; const im = await loadImg(MIRROR + 'escudos/' + f); if(im) im.isPhoto = true; return im; };
  const [escH, escA, ft, escTeam] = await Promise.all([p.sp==='tenis' ? null : crest(p.h), p.sp==='tenis' ? null : crest(p.a), foto(), p.team ? crest(p.team) : null]);
  return {escH, escA, foto: ft, escTeam};
}
function textoVideo(L){
  return `🎬 ${L.length} OPORTUNIDADES DE HOY · ${fechaTxt(DAY).toLowerCase()}\n\n` + L.map((p, i) => `${i+1}️⃣ ${p.kind==='player' ? p.pname + ': ' + p.label.replace(/^.*?·\s*/, '') : p.label} (${p.prob}%)\n   ${p.h} vs ${p.a} · ${hora(p.ts)}${p.hit!=null && p.n ? `\n   📊 ${p.hit} de ${p.n} en sus últimos partidos` : ''}`).join('\n') +
    `\n\n¿Cuál juegas tú? Comenta 👇\nAnálisis completo gratis 👉 alexbetpro.web.app\n\n+18 · Son probabilidades, no garantías.\n#apuestas #pronosticos #NBA #futbol`;
}
async function hacerVideo(L){
  if(VZ.busy || !L.length) return; VZ.busy = true; const ac = audioToque();
  const b = $('vGen'); b.disabled = true; b.textContent = 'Creando…';
  if(VZ.out){ URL.revokeObjectURL(VZ.out.url); VZ.out = null; }
  const box = $('vOut'); box.innerHTML = ''; const cv = document.createElement('canvas'); box.appendChild(cv);
  try{
    const voz = await vozLista(), logo = await loadImg('icon-512.png');
    const r = await crearVideo(L, {day: DAY, fecha: fechaTxt(DAY), logo, img: imgsVideo, lugar, hora: p => hora(p.ts), stats: statsGen(), ayer: ayerRes(DAY), voz, vel: VZ.vel, tono: VZ.tono, canvas: cv, ac, pedirToque, onMsg: (t, pc) => vmsg(t, pc)});
    VZ.out = Object.assign(r, {txt: textoVideo(L), name: `alexbet-video-${DAY}.${r.ext}`});
    vmsg(`Listo · ${Math.round(r.dur)} segundos · ${(r.blob.size/1e6).toFixed(1)} MB · ${r.ext.toUpperCase()}${guardadoErr ? ' · ' + guardadoErr : ''}`);
  }catch(e){ console.error(e); vmsg('No se pudo crear el video: ' + e.message); }
  ac.close().catch(() => {}); VZ.busy = false; b.disabled = false; b.textContent = 'Crear video'; pintarVideo();
}
function pintarVideo(){
  const box = $('vOut'); if(!box || !VZ.out || VZ.busy) return; const o = VZ.out;
  box.innerHTML = `<video src="${o.url}" controls playsinline></video>
    <div class="btns"><button class="btn" id="vSh">Compartir</button><button class="btn ghost" id="vDl">Descargar</button></div>
    <textarea readonly>${esc(o.txt)}</textarea><button class="btn ghost" id="vCp">Copiar texto</button>`;
  const dl = () => { const a = document.createElement('a'); a.href = o.url; a.download = o.name; a.click(); };
  $('vDl').onclick = dl;
  $('vSh').onclick = async () => { const f = new File([o.blob], o.name, {type: o.blob.type}); try{ if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], text:o.txt}); else dl(); }catch(e){} };
  $('vCp').onclick = async () => { try{ await navigator.clipboard.writeText(o.txt); $('vCp').textContent = 'Texto copiado ✓'; }catch(e){} };
}

// ---------- modo automático (facebook.js lo abre sin pantalla con ?bot=1) ----------
if(new URLSearchParams(location.search).has('bot')){
  let SELB = [], TODOS = [], MB = 'pro', LIGA = '';
  // variedad: un partido una sola vez y como mucho maxSp sugerencias por deporte
  const variado = (L, n, maxSp) => { const out = [], cnt = {}, seen = new Set();
    for(const p of L){ const k = p.h + '|' + p.a; if(seen.has(k) || (cnt[p.sp]||0) >= maxSp) continue; out.push(p); seen.add(k); cnt[p.sp] = (cnt[p.sp]||0) + 1; if(out.length >= n) break; } return out; };
  window.__bot = {
    ok: () => PICKS.length > 0 || !!document.querySelector('.msg.err'),
    // deportes con resultados ayer (para publicar uno por deporte)
    deportesRes(){ const d = sumDay(hoy(), -1), c = {}; PICKS.filter(p => dayOf(p.ts) === d && (p.res === 0 || p.res === 1)).forEach(p => { const k = ['nba','ncaa','eul'].includes(p.sp) ? 'bask' : p.sp; c[k] = (c[k]||0) + 1; }); return Object.keys(c).filter(k => c[k] >= 3).sort((a,b) => c[b] - c[a]); },
    elegir(m, opt){
      MB = m; DAY = m === 'res' ? sumDay(hoy(), -1) : hoy(); const now = Date.now();
      if(m === 'res'){
        const enDep = p => !opt || (opt === 'bask' ? ['nba','ncaa','eul'].includes(p.sp) : p.sp === opt);
        TODOS = PICKS.filter(p => dayOf(p.ts) === DAY && (p.res === 0 || p.res === 1) && enDep(p));
        const okL = TODOS.filter(p => p.res === 1).sort((a,b) => b.prob - a.prob), badL = TODOS.filter(p => p.res === 0).sort((a,b) => b.prob - a.prob);
        const nOk = Math.min(okL.length, Math.round(5 * okL.length / Math.max(1, TODOS.length))); // misma proporción que el balance real
        SELB = okL.slice(0, nOk).concat(badL.slice(0, 5 - nOk)).sort((a,b) => a.ts - b.ts);
      } else {
        // primero lo que más mira el público de Ecuador: la Selección y el fútbol ecuatoriano
        // v49 · orden de prioridad para el público de Ecuador: 3 = Ecuador (Selección, LigaPro, Copa Ecuador) · 2 = Libertadores, Sudamericana,
        // selecciones (partidos oficiales), las 5 grandes ligas, Champions, ligas de la región y NBA · 0 = NCAA, segundas divisiones y copas locales de otros países · 1 = el resto
        const TOP = ['lib','sud','recopa','wcqsa','copaam','mundial','wcqeu','euro','euroq','unl','cnl','wcqcc','gold','epl','laliga','seriea','bundes','ligue1','ucl','uel','arg','col','mex','bra','mls'];
        const LOW = ['champ','bundes2','laliga2','serieb','ligue2','league1','league2','natleague','scotchamp','bra2','facup','eflcup','efltrophy','cdr','coppait','pokal','cdf','scocup','scolc','scochal','knvb','taca','cdb','paulista','carioca','mineiro','gaucho','copaarg','copacol','usopen'];
        const prio = p => { const t = /Ecuador/i.test(p.h + ' ' + p.a) || ['ecuador','copaecu','supecu'].includes(p.lid) || /LigaPro|Copa Ecuador/i.test(p.where || '') ? 3
            : (p.sp === 'futbol' && TOP.includes(p.lid)) || p.sp === 'nba' ? 2 : p.sp === 'ncaa' || LOW.includes(p.lid) ? 0 : 1;
          return t > 1 && p.prob < 65 ? 1 : t; }; // con menos de 65% no sube de prioridad
        const pool = proPool().filter(p => dayOf(p.ts) === DAY && p.ts > now + 30*60e3).sort((a,b) => prio(b) - prio(a) || (b.vals?1:0) - (a.vals?1:0) || b.prob - a.prob);
        if(m === 'pro'){ const n = +opt || 4; SELB = variado(pool.filter(p => p.kind === 'team'), n, Math.max(2, Math.ceil(n / 3))).sort((a,b) => b.prob - a.prob); }
        else if(opt === 'nba'){ // Reel solo de NBA: 2 partidos y 2 jugadores titulares
          const nb = pool.filter(p => p.sp === 'nba'), t = variado(nb.filter(p => p.kind === 'team'), 2, 2), j = variado(nb.filter(p => p.kind === 'player' && p.role === 'top').sort((a,b) => b.prob - a.prob), 4 - t.length, 4);
          SELB = t.concat(j); if(SELB.length < 4) SELB = SELB.concat(variado(nb.filter(p => !SELB.includes(p)), 4 - SELB.length, 4)); LIGA = 'NBA';
        }
        else {
          // jugadores: primero los titulares de básquet (puntos, rebotes, asistencias, triples); si no hay, otros con línea de verdad (1.5 o más)
          const pl = pool.filter(p => p.kind === 'player' && p.vals), plTop = pl.filter(p => p.role === 'top').sort((a,b) => b.prob - a.prob), plOtros = pl.filter(p => !p.role && p.ln >= 1.5 && !/falta|tarjeta/i.test(p.mk || ''));
          SELB = variado(pool.filter(p => p.kind === 'team' && p.vals), 2, 1).concat(variado(plTop.length ? plTop : plOtros, 2, 2));
          if(SELB.length < 4) SELB = SELB.concat(variado(pool.filter(p => !SELB.includes(p) && p.vals), 4 - SELB.length, 4));
        }
        TODOS = SELB;
      }
      return SELB.map(p => `${p.label} · ${p.h} vs ${p.a} · ${p.prob}%${p.res != null ? (p.res ? ' ✔' : ' ✖') : ''}`);
    },
    async semana(){ const r = await semana(); return r.n >= 10 ? [`${r.ok} de ${r.n} (${r.pct}%)`] : []; },
    async imagenes(){ MODE = MB; await generar(SELB, TODOS, GL().find(g => g.k === 'top')); return OUT.length; },
    bajar(i){ const a = document.createElement('a'); a.href = OUT[i].url; a.download = OUT[i].name; document.body.appendChild(a); a.click(); },
    texto(i){ if(i != null) return OUT[i].txt; let t = textoVideo(SELB);
      if(LIGA === 'NBA'){ const tags = [...new Set(SELB.flatMap(p => [p.h, p.a]).map(n => '#' + String(n).split(' ').pop().replace(/[^A-Za-z0-9]/g, '')))].slice(0, 6).join(' ');
        t = t.replace(/^🎬 (\d) OPORTUNIDADES DE HOY/, '🏀 $1 OPORTUNIDADES NBA DE HOY').replace(/#apuestas #pronosticos #NBA #futbol$/, '#NBA #NBAenEspañol #pronosticos #apuestas ' + tags); }
      return t; },
    // un solo texto para la publicación con varias imágenes
    textoPro(){ const ic = sp => sp==='futbol'?'⚽':sp==='tenis'?'🎾':sp==='nhl'?'🏒':sp==='mlb'?'⚾':'🏀';
      return `📊 PRONÓSTICOS DEL DÍA · ${fechaTxt(DAY).toLowerCase()}\n\n` + SELB.map(p => `${ic(p.sp)} ${p.h} vs ${p.a} (${hora(p.ts)})\n   👉 ${p.label} · ${p.prob}%`).join('\n') +
        `\n\n¿Cuál juegas tú? Comenta 👇\nAnálisis completo gratis 👉 alexbetpro.web.app\n\n+18 · Son probabilidades, no garantías.\n#pronosticos #apuestasdeportivas #futbol #NBA`; },
    textoRes(){ const d = sumDay(hoy(), -1), R = PICKS.filter(p => dayOf(p.ts) === d && (p.res === 0 || p.res === 1)), ok = R.filter(p => p.res === 1).length;
      const G = [['🏀 Básquet', p => ['nba','ncaa','eul'].includes(p.sp)], ['⚽ Fútbol', p => p.sp==='futbol'], ['🎾 Tenis', p => p.sp==='tenis'], ['🏒 NHL', p => p.sp==='nhl'], ['⚾ MLB', p => p.sp==='mlb']]
        .map(([t, f]) => { const L = R.filter(f); return L.length ? `${t}: ${L.filter(p => p.res === 1).length} de ${L.length}` : ''; }).filter(Boolean);
      return `✅ RESULTADOS DE AYER · ${fechaTxt(d).toLowerCase()}\n\n${ok} de ${R.length} sugerencias acertadas (${R.length ? Math.round(ok / R.length * 100) : 0}%)\n\n${G.join('\n')}\n\nAciertos y fallos, sin esconder nada. Todas, día por día 👉 alexbetpro.web.app/resultados.html\nLas de hoy ya están listas 👉 alexbetpro.web.app\n\n+18 · Son probabilidades, no garantías.`; },
    async video(){
      VZ.id = 'es_ES-sharvard-medium'; VZ.tono = 1; VZ.vel = 1; // voz elegida por Alexander: España · hombre 2, tono y velocidad normales
      const voz = await vozLista(), logo = await loadImg('icon-512.png');
      const r = await crearVideo(SELB, {day: DAY, fecha: fechaTxt(DAY), logo, img: imgsVideo, lugar, hora: p => hora(p.ts), stats: statsGen(), ayer: ayerRes(DAY, LIGA === 'NBA' ? 'nba' : null), voz, vel: VZ.vel, tono: VZ.tono, liga: LIGA, canvas: document.createElement('canvas'), onMsg: t => console.log('BOT ' + t)});
      const a = document.createElement('a'); a.href = r.url; a.download = `alexbet-reel-${DAY}.${r.ext}`; document.body.appendChild(a); a.click();
    }
  };
}

function login(msg){
  $('who').textContent = '';
  $('app').innerHTML = `<div class="msg ${msg ? 'err' : ''}">${esc(msg || 'Entra con tu cuenta de administrador.')}</div><button class="btn" id="goG">Entrar con Google</button>`;
  $('goG').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => login('No se pudo entrar: ' + (e.code || e.message)));
}
onAuthStateChanged(auth, u => {
  if(!u) return login();
  if((u.email || '').toLowerCase() !== ADMIN){ signOut(auth); return login('Esa cuenta no es la de administrador.'); }
  $('who').textContent = u.email;
  cargar();
});
