name: Prueba de videos (no publica)
on:
  push:
    branches: [pub-prueba]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node facebook.js reel:nba --prueba --sin-fb 2>&1 | grep -v "^error en la app" | tail -5
      - run: node facebook.js ana --prueba --sin-fb 2>&1 | grep -v "^error en la app" | tail -5
      - run: node facebook.js radar --prueba --sin-fb 2>&1 | grep -v "^error en la app" | tail -5
      - name: Guardar cuadros
        if: always()
        run: |
          mkdir -p prueba-out; ls -la fb-out; for f in fb-out/*.mp4 fb-out/*.webm; do [ -f "$f" ] || continue; b=$(basename "$f"); ffmpeg -v error -y -i "$f" -vf "fps=1/4,scale=270:-1" "prueba-out/$b-%02d.png" || true; done
          ls prueba-out | head -40
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add -f prueba-out && git commit -qm "cuadros de prueba" && git push
