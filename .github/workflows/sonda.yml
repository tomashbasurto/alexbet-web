name: Sonda ESPN
on: push
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: espn-sonda, path: sonda-br}
      - uses: actions/checkout@v4
        with: {ref: main, path: app}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          cd sonda-br/sonda && node aud.js $GITHUB_WORKSPACE/app
