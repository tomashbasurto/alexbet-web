name: Sonda ESPN
on: push
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: espn-sonda, path: sonda-br}
      - uses: actions/checkout@v4
        with: {ref: main, path: app}
      - run: |
          pip install -q playwright piper-tts
          python -m playwright install --with-deps chromium >/dev/null
          cd sonda-br/sonda && mkdir -p out
          curl -sL -o voz.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/ald/medium/es_MX-ald-medium.onnx
          curl -sL -o voz.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/ald/medium/es_MX-ald-medium.onnx.json
          python voz.py || echo VOZFAIL
          AB_ROOT=$GITHUB_WORKSPACE/app OUT=out python cap.py || echo CAPFAIL
          ls -la out
          cd .. && git config user.name bot && git config user.email bot@x && git add sonda/out && git commit -qm "salida sonda" && git push -q origin espn-sonda
