name: Sonda ESPN
on: push
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: espn-sonda}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          cd sonda && mkdir -p out && node corners.js
          cd .. && git config user.name bot && git config user.email bot@x && git add sonda/out/corners.json && git commit -qm "córners" && git push -q
