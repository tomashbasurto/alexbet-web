name: Sonda ESPN
on: push
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > a.py <<'P'
          import json,urllib.request
          B='https://site.api.espn.com/apis/site/v2/sports'
          for path,tid in [('basketball/nba','13'),('hockey/nhl','10'),('basketball/mens-college-basketball','150')]:
            try:
              j=json.load(urllib.request.urlopen(f"{B}/{path}/teams/{tid}/statistics"))
              print('##',path,list(j.keys()))
              r=j.get('results') or {}; print('results keys',list(r.keys()) if isinstance(r,dict) else type(r))
              st=(r.get('stats') or {}) if isinstance(r,dict) else {}
              cats=st.get('categories') or []
              for c in cats:
                print(' CAT',c.get('name'), [(s.get('name'),s.get('displayValue')) for s in c.get('stats',[])][:40])
            except Exception as e: print('ERR',path,e)
          P
          python3 a.py
