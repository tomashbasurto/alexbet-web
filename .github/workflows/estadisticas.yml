name: Estadisticas futbol
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'estadisticas.js'
      - '.github/workflows/estadisticas.yml'
permissions:
  contents: write
concurrency:
  group: espn
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node estadisticas.js
      - name: Guardar
        run: |
          git config user.name "alexbet-bot"
          git config user.email "alexbet-bot@users.noreply.github.com"
          git add stats-futbol.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "Estadisticas futbol"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
