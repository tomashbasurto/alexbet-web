name: Corners
on:
  schedule:
    - cron: '17 10,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'corners.js'
      - '.github/workflows/corners.yml'
permissions:
  contents: write
concurrency:
  group: corners
  cancel-in-progress: false
jobs:
  corners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Córners por liga y partidos próximos
        run: node corners.js
      - name: Guardar
        run: |
          git config user.name "alexbet-bot"
          git config user.email "alexbet-bot@users.noreply.github.com"
          git add corners.json
          git diff --staged --quiet && exit 0
          git commit -m "Córners"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
