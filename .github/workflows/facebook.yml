name: Publicar en Facebook
# Horario (Ecuador = UTC-5): 8:00 resultados de ayer · 10:00 pronósticos (2 imágenes) · 10:30 Reel general · 16:00 Reel de NBA · domingo 18:00 resumen semanal
# Los horarios de GitHub llegan con horas de atraso, así que un trabajo "plan" queda despierto ~5,5 h, revisa cada minuto
# el horario y los pedidos del panel ("Publicar ya", pausa) y al terminar lanza el siguiente. Los horarios de abajo solo lo reviven si se corta.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'plan, check, pro:8, resdep, reel, reel:nba o sem'
        default: 'plan'
      prueba:
        description: 'si: arma todo pero no publica (no aplica a plan)'
        default: 'no'
permissions:
  contents: read
  actions: write
concurrency:
  group: facebook
  cancel-in-progress: false
jobs:
  fb:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Qué toca
        id: m
        run: |
          M="${{ inputs.modo }}"; [ -z "$M" ] && M=plan
          echo "modo=$M" >> $GITHUB_OUTPUT; echo "t0=$(date +%s)" >> $GITHUB_OUTPUT
          if [ "$M" != "plan" ] && [ "${{ inputs.prueba }}" = "si" ]; then echo "prueba=--prueba" >> $GITHUB_OUTPUT; else echo "prueba=" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador sin pantalla y programa de video
        if: steps.m.outputs.modo != 'check'
        run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Publicar
        run: node facebook.js "${{ steps.m.outputs.modo }}" ${{ steps.m.outputs.prueba }}
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Lanzar el siguiente turno
        if: always() && steps.m.outputs.modo == 'plan'
        run: |
          # si este turno terminó muy rápido (algo falló), espera 20 min para no lanzar turnos en cadena
          e=$(( $(date +%s) - ${{ steps.m.outputs.t0 }} )); [ $e -lt 1200 ] && sleep $(( 1200 - e )) || true
          gh api -X POST repos/${{ github.repository }}/actions/workflows/facebook.yml/dispatches -f ref=main -f 'inputs[modo]=plan' -f 'inputs[prueba]=no'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Guardar lo armado (para revisarlo)
        if: always() && steps.m.outputs.modo != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: publicacion
          path: fb-out/
          if-no-files-found: ignore
          retention-days: 7
