name: Equipos NCAA y NHL
on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'equipos.js'
      - '.github/workflows/equipos.yml'
permissions:
  contents: write
concurrency:
  group: espn
  cancel-in-progress: false
jobs:
  equipos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node equipos.js
      - name: Guardar
        run: |
          git config user.name "alexbet-bot"
          git config user.email "alexbet-bot@users.noreply.github.com"
          git add equipos-*.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "Equipos NCAA y NHL"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
