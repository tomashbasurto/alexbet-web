name: Reel solo en Instagram
# Arma un reel (reel o reel:nba) con los datos del momento y lo publica SOLO en Instagram (a pedido)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'reel o reel:nba'
        default: 'reel:nba'
permissions:
  contents: write
jobs:
  ig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node facebook.js "${{ inputs.modo }}"
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          IG_ONLY: '1'
