name: Prueba de video analisis
on:
  workflow_dispatch:
    inputs:
      modo:
        default: 'radar'
      rsel:
        default: ''
      sel:
        description: 'llave de la jugada (vacío = la mejor del día)'
        default: ''
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node facebook.js ${{ inputs.modo }} --prueba --sin-fb
        env:
          FB_ANA: ${{ inputs.sel }}
          FB_RADAR: ${{ inputs.rsel }}
      - name: Copia para revisar (rama tenis-probe)
        if: always()
        run: |
          f=$(ls fb-out/*.mp4 fb-out/*.webm 2>/dev/null | head -1); [ -z "$f" ] && exit 0
          ffmpeg -v error -y -i "$f" -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -c:a aac -movflags +faststart /tmp/ana.mp4
          git fetch -q origin tenis-probe && git checkout -q -B tp origin/tenis-probe && mkdir -p probe/ana && cp /tmp/ana.mp4 probe/ana/ana.mp4
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add probe/ana && git commit -qm "ana" && git push -q origin tp:tenis-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analisis
          path: fb-out/
          if-no-files-found: ignore
          retention-days: 3
