name: Revisar Instagram
# Revisa los permisos de la llave de Facebook y si la página tiene Instagram vinculado (no publica nada)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
      - run: node facebook.js check
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          IG_TEST: '1'
