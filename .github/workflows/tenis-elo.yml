name: Elo de tenis
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tenis-elo.js'
      - '.github/workflows/tenis-elo.yml'
permissions:
  contents: write
concurrency:
  group: espn
  cancel-in-progress: false
jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calcular Elo con los resultados de ESPN
        run: node tenis-elo.js
      - name: Guardar
        run: |
          git config user.name "alexbet-bot"
          git config user.email "alexbet-bot@users.noreply.github.com"
          git add elo-tenis.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "Elo de tenis"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
