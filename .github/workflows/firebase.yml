name: Publicar en alexbetpro.web.app
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'premium.js'
      - 'admin.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '*.png'
      - 'firebase.json'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar en Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('cuenta:', d.get('client_email'))" "$RUNNER_TEMP/sa.json"; then
            echo "::error::El secreto FIREBASE_SERVICE_ACCOUNT no es un JSON válido (¿se copió completo?)"; exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only hosting --project alexbet-e14aa --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/out.txt"
          if [ $rc -ne 0 ]; then
            grep -iE 'error|denied|permission|not found|403|404|enable' "$RUNNER_TEMP/out.txt" | tail -6 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          rm -f "$RUNNER_TEMP/sa.json"
          exit $rc
