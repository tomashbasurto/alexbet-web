name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json
          u='https://statsapi.mlb.com/api/v1/people?personIds=805673,543037&hydrate=stats(group=[pitching],type=[season],season=2026)'
          j=json.load(urllib.request.urlopen(u,timeout=30))
          for p in j['people']: print('P',p['fullName'], json.dumps(p.get('stats'))[:900])
          PY
