name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          B=https://site.api.espn.com/apis/site/v2/sports/tennis
          D=$(date -u +%Y%m%d)
          T=$(date -u -d tomorrow +%Y%m%d); T2=$(date -u -d '+3 day' +%Y%m%d); Y=$(date -u -d '-20 day' +%Y%m%d)
          rm -f probe/*
          curl -sS "$B/wta/rankings" -o probe/wrank.json || true
          curl -sS "$B/atp/scoreboard?dates=$T" -o probe/atp_t.json || true
          curl -sS "$B/atp/scoreboard?dates=$T2" -o probe/atp_t2.json || true
          curl -sS "$B/atp/scoreboard?dates=$Y" -o probe/atp_y.json || true
          curl -sS "$B/wta/scoreboard?dates=$T" -o probe/wta_t.json || true
          ls -la probe
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add -A probe; git commit -m "probe" && git push
