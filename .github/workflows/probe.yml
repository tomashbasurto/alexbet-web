name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json
          def g(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=25))
              except Exception as e: return {'ERR':str(e)}
          sb=g('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261111')
          evs=sb.get('events',[]); print('EVENTS',len(evs))
          e=evs[0]; c=e['competitions'][0]
          for k in c['competitors']: print('STATS', k['team']['displayName'], [ (s.get('name'),s.get('displayValue')) for s in k.get('statistics',[])], 'LINES', [l.get('value') for l in k.get('linescores',[])])
          sb2=g('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261112'); e2=sb2['events'][0]; eid=e2['id']
          print('NEXT', e2['name'], eid)
          base=f'https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/{eid}/competitions/{eid}/odds'
          o=g(base); print('ODDS', json.dumps(o)[:300])
          pb=g(f'{base}/100/propBets?limit=1000'); import collections
          its=pb.get('items',[]); print('TYPES', collections.Counter((x.get('type') or {}).get('name') for x in its).most_common(60))
          aid=lambda x:(x.get('athlete') or {}).get('$ref','').split('/athletes/')[-1].split('?')[0]
          a0=aid(its[0]); print('ATH', a0)
          for x in its:
              if aid(x)==a0: print('  ', (x.get('type') or {}).get('name'), json.dumps(x.get('odds'))[:200], x.get('current'))
          PY
