name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd probe
          python3 - <<'PY'
          import json, urllib.request
          B='https://site.api.espn.com/apis/site/v2/sports/soccer/'
          out=[]
          for s in open('slugs.txt').read().split():
              row={'slug':s}
              for rng in ['20250701-20251231','20260101-20260630','20260701-20261231']:
                  try:
                      j=json.load(urllib.request.urlopen(urllib.request.Request(B+s+'/scoreboard?dates='+rng+'&limit=500',headers={'User-Agent':'Mozilla/5.0'}),timeout=25))
                      L=(j.get('leagues') or [{}])[0]
                      row['name']=L.get('name') or L.get('abbreviation'); row[rng]=len(j.get('events',[]))
                      ev=j.get('events',[])
                      if ev: row['last_'+rng]=ev[-1].get('date','')[:10]
                  except Exception as e: row[rng]='ERR '+str(e)[:40]
              out.append(row); print(row)
          json.dump(out,open('result.json','w'),indent=1)
          PY
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add -A .; git commit -qm "probe slugs" && git push
