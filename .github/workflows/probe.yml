name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -I -H "Origin: https://alexbetpro.web.app" https://a.espncdn.com/i/teamlogos/soccer/500/368.png | grep -i -E "^HTTP|access-control|content-type"; curl -sS -I -H "Origin: https://alexbetpro.web.app" "https://a.espncdn.com/combiner/i?img=/i/teamlogos/soccer/500/368.png&w=80&h=80" | grep -i -E "^HTTP|access-control"
