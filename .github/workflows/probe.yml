name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def g(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30))
          j=g('https://sports.core.api.espn.com/v2/sports/soccer/leagues?limit=1000')
          print('COUNT',j.get('count'))
          import concurrent.futures as cf
          refs=[i['$ref'] for i in j.get('items',[])]
          def one(r):
              try:
                  L=g(r); return L.get('slug'),L.get('name')
              except Exception as e: return r,'ERR'
          with cf.ThreadPoolExecutor(20) as ex:
              for s,n in ex.map(one,refs):
                  if s and any(s.startswith(p) for p in ['ecu','por','bel','tur','gre','mex','col','arg','bra','usa','concacaf','conmebol','ned','sco','ita','ger','fra','esp','eng']): print('LG',s,'|',n)
          PY
