name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json
          def g(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=25))
              except Exception as e: return {'ERR':str(e)}
          B='https://www.thesportsdb.com/api/v1/json/123/'
          for lid,ss in [('5636',['2026']),('5884',['2026']),('5831',['2026-2027','2025-2026']),('5830',['2026-2027','2025-2026']),('4686',['2026'])]:
              print('==',lid)
              for q in ['eventsnextleague.php?id='+lid,'eventspastleague.php?id='+lid]+['eventsseason.php?id=%s&s=%s'%(lid,s) for s in ss]+['lookupleague.php?id='+lid]:
                  j=g(B+q)
                  if 'leagues' in j: print(q, [(l.get('strLeague'),l.get('strCurrentSeason')) for l in j['leagues'] or []]); continue
                  ev=j.get('events') or []
                  print(q,'n=',len(ev), j.get('ERR',''))
                  for e in ev[-6:]: print('   ',e.get('strTimestamp'),e.get('dateEvent'),e.get('strTime'),'|',e.get('strHomeTeam'),'vs',e.get('strAwayTeam'),'|',e.get('intHomeScore'),e.get('intAwayScore'),e.get('strStatus'),e.get('intRound'))
          j=g(B+'eventsday.php?d=2026-11-04&s=Soccer'); ev=j.get('events') or []
          print('DAY n=',len(ev),[ (e['strLeague'],e['strEvent']) for e in ev if 'Ecuador' in (e.get('strLeague') or '')])
          PY
