name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; rm -f probe/*
          O="Origin: https://alexbetpro.web.app"
          for u in "site/v2/sports/baseball/mlb/scoreboard?dates=20261031" "site/v2/sports/baseball/mlb/scoreboard?dates=20261030" "v2/sports/baseball/mlb/standings" "site/v2/sports/basketball/nba/scoreboard?dates=20261031" "site/v2/sports/tennis/atp/scoreboard"; do
            echo "== $u" >> probe/out.txt
            curl -sS -m 20 -D - -o /tmp/b -H "$O" "https://site.api.espn.com/apis/$u" | grep -iE '^HTTP|access-control|content-type' >> probe/out.txt
            head -c 300 /tmp/b >> probe/out.txt; echo >> probe/out.txt
            python3 -c "import json;j=json.load(open('/tmp/b'));print('events',len(j.get('events',[])))" >> probe/out.txt 2>&1 || true
          done
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add -A probe; git commit -m "probe mlb" && git push
