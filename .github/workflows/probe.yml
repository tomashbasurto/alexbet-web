name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd probe; mkdir -p out
          python3 - <<'PY'
          import json, hashlib, urllib.request, concurrent.futures as cf
          U=json.load(open('urls.json'))
          def get(u):
              ext='.img' if 'espncdn' in u else '.json'
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=20).read()
                  open('out/'+hashlib.md5(u.encode()).hexdigest()+ext,'wb').write(r)
              except Exception as e: print('fail',u,e)
          with cf.ThreadPoolExecutor(16) as ex: list(ex.map(get,U))
          PY
          ls out | wc -l
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add -A .; git commit -qm "probe cache" && git push
