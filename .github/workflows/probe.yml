name: Probe ESPN tenis
on:
  push:
    branches: [tenis-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def g(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30))
              except Exception as e: print('ERR',u,e); return {}
          B='https://site.api.espn.com/apis/site/v2/sports/soccer/'
          for u in [B+'ecu.1/teams/9283/schedule', B+'ecu.1/teams/9283/schedule?fixture=true', B+'ecu.1/teams/9283/schedule?season=2026', B+'all/teams/9283/schedule', B+'ecu.1/teams/9283/schedule?fixture=true&season=2026']:
              j=g(u); ev=j.get('events',[])
              print('URL',u,'events',len(ev))
              for e in ev[-12:]:
                  c=(e.get('competitions') or [{}])[0]
                  print('  ',e.get('date','')[:16],e.get('name'),'|',(e.get('league') or {}).get('slug'),(e.get('league') or {}).get('name'),'|',(c.get('type') or {}).get('abbreviation'),'|',e.get('seasonType',{}).get('name') if isinstance(e.get('seasonType'),dict) else '', '|', (c.get('status') or {}).get('type',{}).get('name'))
          PY
