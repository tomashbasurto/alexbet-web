name: Sonda Euroliga
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/sonda-eu.js']
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/sonda-eu.js
