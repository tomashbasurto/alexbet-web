name: Oportunidades
on:
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'oportunidades.js'
      - '.github/workflows/oportunidades.yml'
permissions:
  contents: write
concurrency:
  group: oportunidades
  cancel-in-progress: false
jobs:
  oport:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador sin pantalla
        run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Calcular oportunidades
        run: node oportunidades.js
      - name: Guardar
        run: |
          git config user.name "alexbet-bot"
          git config user.email "alexbet-bot@users.noreply.github.com"
          git add oportunidades.json
          git diff --staged --quiet && exit 0
          git commit -m "Oportunidades"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
